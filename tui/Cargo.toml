[package]
name = "dawgz-tui"
version = "0.1.0"
edition = "2021"
description = "Interactive terminal interface for dawgz workflows"
license = "MIT"
rust-version = "1.82"

[[bin]]
name = "dawgz-tui"
path = "src/main.rs"

[dependencies]
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = 3
strip = true
